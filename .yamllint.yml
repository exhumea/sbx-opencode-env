---
extends: default

ignore: |
  sbx-kits-contrib/

rules:
  line-length:
    max: 120
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  # GitHub Actions relies on `on:` being a key, not a boolean.
  truthy:
    allowed-values: ['true', 'false', 'on', 'off']
    check-keys: false
